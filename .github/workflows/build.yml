name: Build & Release

# Runs on every push to main, and can be triggered by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# Least privilege: the job only needs to push the version commit/tag and the release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A "[skip ci]" release commit must not start another run (avoids a loop).
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bump version from Conventional Commits
        id: version
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          chmod +x scripts/bump_version.sh
          scripts/bump_version.sh "${{ github.event.inputs.bump || 'auto' }}"

      - name: Verify build number increased
        # Every release needs a versionCode higher than the last one, or Android
        # would refuse the in-app update. The bump script increments it; this
        # guard fails loudly if that ever stops happening.
        if: steps.version.outputs.released == 'true'
        run: |
          new_full=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          new_build="${new_full##*+}"
          prev_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          prev_build=0
          if [ -n "$prev_tag" ]; then
            prev_full=$(git show "${prev_tag}:pubspec.yaml" 2>/dev/null | grep -E '^version:' | head -1 | awk '{print $2}')
            if printf '%s' "$prev_full" | grep -q '+'; then
              prev_build="${prev_full##*+}"
            fi
          fi
          if [ "$new_build" -le "$prev_build" ]; then
            echo "::error::Build number did not increase ($prev_build -> $new_build)."
            exit 1
          fi
          echo "Build number $prev_build -> $new_build"

      - name: Commit and tag the release
        if: steps.version.outputs.released == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml CHANGELOG.md
          git commit -m "chore(release): ${{ steps.version.outputs.tag }} [skip ci]"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Use Flutter's default NDK on CI
        # The repo pins an NDK revision that exists on the maintainer's machine.
        # CI falls back to Flutter's default NDK, which the runner installs.
        run: sed -i 's/^dipiNdkVersion=.*/dipiNdkVersion=/' android/gradle.properties

      - name: Configure release signing
        # A shared keystore is mandatory: Android only updates an app when the
        # new APK is signed with the same key as the installed one.
        if: steps.version.outputs.released == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Add the four signing secrets so every release shares one signature (in-app update needs this)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "Release keystore configured."

      - name: Build split-per-ABI release APKs
        if: steps.version.outputs.released == 'true'
        run: flutter build apk --release --split-per-abi

      - name: Build universal release APK
        if: steps.version.outputs.released == 'true'
        run: flutter build apk --release

      - name: Name the APKs clearly
        if: steps.version.outputs.released == 'true'
        run: |
          v="${{ steps.version.outputs.version }}"
          out=build/app/outputs/flutter-apk
          mkdir -p dist
          cp "$out/app-release.apk" "dist/dipi-v${v}-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="$out/app-${abi}-release.apk"
            [ -f "$src" ] && cp "$src" "dist/dipi-v${v}-${abi}.apk"
          done
          ls -l dist

      - name: Compute SHA-256 checksums
        # One `<hash>  <filename>` file per APK. The app verifies the download
        # against these before it will install anything.
        if: steps.version.outputs.released == 'true'
        run: |
          cd dist
          for f in *.apk; do
            sha256sum "$f" > "$f.sha256"
          done
          cat *.sha256

      - name: Prepare release notes
        # The newest CHANGELOG section, built from Conventional Commits by
        # scripts/bump_version.sh.
        if: steps.version.outputs.released == 'true'
        run: |
          awk '/^# /{c++} c==1' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            git log -1 --pretty=format:'%s' > release-notes.md
          fi
          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: Upload APKs as workflow artifacts
        if: steps.version.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dipi-v${{ steps.version.outputs.version }}
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error

      - name: Create GitHub Release with the APKs and checksums
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/*.apk \
            dist/*.sha256 \
            --title "دیپی ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md
