name: Build & Release

# Runs on every push to main, and can be triggered by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# Least privilege: the job only needs to push the version commit/tag and the release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A "[skip ci]" release commit must not start another run (avoids a loop).
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bump version from Conventional Commits
        id: version
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          chmod +x scripts/bump_version.sh
          scripts/bump_version.sh "${{ github.event.inputs.bump || 'auto' }}"

      - name: Commit and tag the release
        if: steps.version.outputs.released == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml CHANGELOG.md
          git commit -m "chore(release): ${{ steps.version.outputs.tag }} [skip ci]"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Use Flutter's default NDK on CI
        # The repo pins an NDK revision that exists on the maintainer's machine.
        # CI falls back to Flutter's default NDK, which the runner installs.
        run: sed -i 's/^dipiNdkVersion=.*/dipiNdkVersion=/' android/gradle.properties

      - name: Configure release signing (optional)
        if: steps.version.outputs.released == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
            echo "Release keystore configured."
          else
            echo "::warning::No KEYSTORE_BASE64 secret set — APK will be signed with the debug keys. Add the four signing secrets for a properly signed release."
          fi

      - name: Build split-per-ABI release APKs
        if: steps.version.outputs.released == 'true'
        run: flutter build apk --release --split-per-abi

      - name: Build universal release APK
        if: steps.version.outputs.released == 'true'
        run: flutter build apk --release

      - name: Name the APKs clearly
        if: steps.version.outputs.released == 'true'
        run: |
          v="${{ steps.version.outputs.version }}"
          out=build/app/outputs/flutter-apk
          mkdir -p dist
          cp "$out/app-release.apk" "dist/dipi-v${v}-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="$out/app-${abi}-release.apk"
            [ -f "$src" ] && cp "$src" "dist/dipi-v${v}-${abi}.apk"
          done
          ls -l dist

      - name: Upload APKs as workflow artifacts
        if: steps.version.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dipi-v${{ steps.version.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release with the APKs
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/*.apk \
            --title "دیپی ${{ steps.version.outputs.version }}" \
            --generate-notes
