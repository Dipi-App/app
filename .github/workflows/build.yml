name: Build & Release

# Releases are cut by pushing a version tag, e.g. `git tag v1.2.3 && git push origin v1.2.3`.
# Pushing to `main` still runs the analyzer/tests and can auto-bump + tag + release
# using Conventional Commits. A manual run is available from the Actions tab.
on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (used for main-branch runs)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# Least privilege: the job only needs to push the version commit/tag and the release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A "[skip ci]" release commit must not start another run (avoids a loop).
    # Tag pushes always run.
    if: ${{ github.ref_type == 'tag' || github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---------------------------------------------------------------------
      # Work out which version/tag this run is for.
      # ---------------------------------------------------------------------

      - name: Resolve version from the pushed tag
        id: version
        if: ${{ github.ref_type == 'tag' }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          public=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          public="${public%%+*}"
          if [ "$public" != "$version" ]; then
            echo "::error::pubspec.yaml version is $public but the tag is $tag. Bump pubspec first."
            exit 1
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (from an existing tag)."

      - name: Bump version from Conventional Commits
        id: bump
        if: ${{ github.ref_type != 'tag' }}
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          chmod +x scripts/bump_version.sh
          scripts/bump_version.sh "${{ github.event.inputs.bump || 'auto' }}"

      - name: Use the bump result on main-branch runs
        if: ${{ github.ref_type != 'tag' }}
        run: |
          echo "released=${{ steps.bump.outputs.released }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.bump.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ steps.bump.outputs.tag }}" >> "$GITHUB_OUTPUT"
        id: mainversion

      - name: Verify build number increased
        # Every release needs a versionCode higher than the last one, or Android
        # would refuse the in-app update. The bump script increments it; this
        # guard fails loudly if that ever stops happening.
        if: ${{ github.ref_type != 'tag' && steps.bump.outputs.released == 'true' }}
        run: |
          new_full=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          new_build="${new_full##*+}"
          prev_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          prev_build=0
          if [ -n "$prev_tag" ]; then
            prev_full=$(git show "${prev_tag}:pubspec.yaml" 2>/dev/null | grep -E '^version:' | head -1 | awk '{print $2}')
            if printf '%s' "$prev_full" | grep -q '+'; then
              prev_build="${prev_full##*+}"
            fi
          fi
          if [ "$new_build" -le "$prev_build" ]; then
            echo "::error::Build number did not increase ($prev_build -> $new_build)."
            exit 1
          fi
          echo "Build number $prev_build -> $new_build"

      - name: Commit and tag the release
        if: ${{ github.ref_type != 'tag' && steps.bump.outputs.released == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml CHANGELOG.md
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }} [skip ci]"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${{ steps.bump.outputs.tag }}"

      # ---------------------------------------------------------------------
      # Build, verify and release.
      # ---------------------------------------------------------------------

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Use Flutter's default NDK on CI
        # The repo pins an NDK revision that exists on the maintainer's machine.
        # CI falls back to Flutter's default NDK, which the runner installs.
        run: sed -i 's/^dipiNdkVersion=.*/dipiNdkVersion=/' android/gradle.properties

      - name: Decode the release keystore
        # A shared keystore is mandatory: Android only updates an app when the
        # new APK is signed with the same key as the installed one.
        if: ${{ steps.version.outputs.released == 'true' || steps.mainversion.outputs.released == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Add the four signing secrets so every release shares one signature (in-app update needs this)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          echo "Release keystore decoded."

      - name: Build split-per-ABI release APKs
        if: ${{ steps.version.outputs.released == 'true' || steps.mainversion.outputs.released == 'true' }}
        env:
          DIPI_KEYSTORE_FILE: upload-keystore.jks
          DIPI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DIPI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DIPI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Build universal release APK
        if: ${{ steps.version.outputs.released == 'true' || steps.mainversion.outputs.released == 'true' }}
        env:
          DIPI_KEYSTORE_FILE: upload-keystore.jks
          DIPI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DIPI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DIPI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Name the APKs clearly
        # Stable universal names: `dipi.apk` (the fixed download URL the website
        # links to) and `dipi-<version>.apk`, plus one file per ABI.
        if: ${{ steps.version.outputs.released == 'true' || steps.mainversion.outputs.released == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version || steps.mainversion.outputs.version }}
        run: |
          out=build/app/outputs/flutter-apk
          mkdir -p dist
          cp "$out/app-release.apk" "dist/dipi.apk"
          cp "$out/app-release.apk" "dist/dipi-${VERSION}.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="$out/app-${abi}-release.apk"
            [ -f "$src" ] && cp "$src" "dist/dipi-${VERSION}-${abi}.apk"
          done
          ls -l dist

      - name: Verify the APKs are signed with the release key
        # Fail the build if anything came out signed with the Android Debug key.
        if: ${{ steps.version.outputs.released == 'true' || steps.mainversion.outputs.released == 'true' }}
        run: |
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          apksigner="$(ls -1 "$sdk"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found under $sdk/build-tools."
            exit 1
          fi
          echo "Using $apksigner"
          for f in dist/*.apk; do
            echo "::group::apksigner verify $f"
            certs="$("$apksigner" verify --verbose --print-certs "$f")"
            echo "$certs"
            echo "::endgroup::"
            if echo "$certs" | grep -qi "Android Debug"; then
              echo "::error::$f is signed with the Android Debug key. Refusing to release."
              exit 1
            fi
            if ! echo "$certs" | grep -q "Verified using v2 scheme.* true"; then
              echo "::error::$f is missing a v2 signature."
              exit 1
            fi
            if ! echo "$certs" | grep -q "Verified using v3 scheme.* true"; then
              echo "::warning::$f has no v3 signature."
            fi
          done
          echo "All APKs are signed with the release key."

      - name: Compute SHA-256 checksums
        if: ${{ steps.version.outputs.released == 'true' || steps.mainversion.outputs.released == 'true' }}
        run: |
          cd dist
          for f in *.apk; do
            sha256sum "$f" > "$f.sha256"
          done
          cat *.sha256

      - name: Prepare release notes
        # The newest CHANGELOG section (its first block), built from Conventional
        # Commits by scripts/bump_version.sh, plus the SHA-256 list and a link to
        # the install guide.
        if: ${{ steps.version.outputs.released == 'true' || steps.mainversion.outputs.released == 'true' }}
        env:
          TAG: ${{ steps.version.outputs.tag || steps.mainversion.outputs.tag }}
        run: |
          if [ -f CHANGELOG.md ]; then
            awk 'NR==1{print; next} /^#/{exit} {print}' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            git log -1 --pretty=format:'%s' > release-notes.md
          fi
          {
            echo
            echo "### SHA-256"
            echo
            echo '```'
            cat dist/*.sha256
            echo '```'
            echo
            echo "> راهنمای نصب گام‌به‌گام: [docs/INSTALL.fa.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/INSTALL.fa.md)"
          } >> release-notes.md
          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: Upload APKs as workflow artifacts
        if: ${{ steps.version.outputs.released == 'true' || steps.mainversion.outputs.released == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dipi-${{ steps.version.outputs.version || steps.mainversion.outputs.version }}
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error

      - name: Create GitHub Release with the APKs and checksums
        if: ${{ steps.version.outputs.released == 'true' || steps.mainversion.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag || steps.mainversion.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version || steps.mainversion.outputs.version }}
        run: |
          gh release create "$TAG" \
            dist/*.apk \
            dist/*.sha256 \
            --title "دیپی ${VERSION}" \
            --notes-file release-notes.md
